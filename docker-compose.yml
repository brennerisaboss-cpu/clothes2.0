# Postgres for local development.
#
#   docker compose up -d
#   npm run setup
#
# Only here so `npm run setup` has something to connect to on a machine without
# Postgres installed. A hosted database (Supabase) works identically — set
# DATABASE_URL and skip this file entirely.
services:
  db:
    image: postgres:16-alpine
    container_name: resale-tracker-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clothes
    ports:
      - '5432:5432'
    volumes:
      - resale-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  resale-pgdata:
